<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realistic 3D Bee - Natural Loading Animation | Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        /* Loading overlay - will fade out during the final zoom */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0e1a 0%, #03060c 100%);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: opacity 1.8s cubic-bezier(0.23, 1, 0.32, 1);
            opacity: 1;
            backdrop-filter: blur(0px);
        }
        
        /* Minimal loading text - subtle */
        .loading-text {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(210, 180, 140, 0.6);
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: 400;
            font-family: 'Inter', monospace;
            text-transform: uppercase;
            z-index: 101;
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            width: fit-content;
            margin: 0 auto;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        
        .hidden-overlay {
            display: none !important;
        }
        
        canvas {
            display: block;
            vertical-align: bottom;
        }
        
        .info-note {
            position: fixed;
            bottom: 15px;
            right: 15px;
            color: rgba(255,255,200,0.4);
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-family: monospace;
            z-index: 200;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="loading-text">✦ BEE APPROACHING ✦</div>
    </div>
    <div class="info-note">Three.js | Realistic Bee • Natural Flight Path</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // --- Setup Scene, Camera, Renderer ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b14);
        scene.fog = new THREE.FogExp2(0x050b14, 0.012); // subtle atmospheric fog
        
        // Camera: fixed perspective, the bee will move toward camera to create "zoom up to user" effect
        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 9.5);
        camera.lookAt(0, 1.2, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        // --- Realistic Lighting ---
        // Ambient (soft)
        const ambientLight = new THREE.AmbientLight(0x2c3e55, 0.45);
        scene.add(ambientLight);
        
        // Key light (warm directional)
        const keyLight = new THREE.DirectionalLight(0xffeebb, 1.2);
        keyLight.position.set(3, 5, 4);
        keyLight.castShadow = true;
        keyLight.receiveShadow = false;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 12;
        scene.add(keyLight);
        
        // Fill light (cool blue from below/back)
        const fillLight = new THREE.PointLight(0x6688aa, 0.5);
        fillLight.position.set(-1, -1, 2);
        scene.add(fillLight);
        
        // Rim/Back light (golden edge)
        const rimLight = new THREE.PointLight(0xffaa66, 0.7);
        rimLight.position.set(-2, 2, -4);
        scene.add(rimLight);
        
        // Additional soft fill from camera direction
        const frontFill = new THREE.PointLight(0xd4bb88, 0.35);
        frontFill.position.set(0, 1.2, 4);
        scene.add(frontFill);
        
        // Dynamic subtle light that follows bee slightly? Not exactly, but we add a small glow later.
        
        // --- Environment: subtle grass field reference and particles for depth ---
        // Ground reference (translucent grid with circular fade)
        const gridHelper = new THREE.GridHelper(22, 28, 0x88aacc, 0x335577);
        gridHelper.position.y = -1.2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.2;
        scene.add(gridHelper);
        
        // Floating dust particles (very subtle)
        const particleCount = 1200;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 28;
            particlePositions[i*3+1] = (Math.random() - 0.5) * 8 + 0.5;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 20 - 5;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xaaddff, size: 0.035, transparent: true, opacity: 0.35 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);
        
        // Simple distant blurred orbs (bokeh style)
        const bgOrbs = [];
        for (let i = 0; i < 40; i++) {
            const orbMat = new THREE.MeshStandardMaterial({ color: 0x88aadd, emissive: 0x224466, transparent: true, opacity: 0.15 });
            const orb = new THREE.Mesh(new THREE.SphereGeometry(0.08 + Math.random()*0.12, 8, 8), orbMat);
            orb.position.set((Math.random() - 0.5) * 18, (Math.random() - 0.5) * 6, -8 + Math.random() * -5);
            scene.add(orb);
            bgOrbs.push(orb);
        }
        
        // --- REALISTIC BEE MODEL (Detailed, anatomically inspired, not cartoon) ---
        const beeGroup = new THREE.Group();
        
        // 1. Abdomen (elongated oval shape)
        const abdomenGeo = new THREE.SphereGeometry(0.52, 48, 48);
        const abdomenMat = new THREE.MeshStandardMaterial({ color: 0x4a3a22, roughness: 0.38, metalness: 0.05, emissive: 0x1a1208 });
        const abdomen = new THREE.Mesh(abdomenGeo, abdomenMat);
        abdomen.scale.set(1.3, 0.85, 1.6);
        abdomen.position.z = -0.65;
        abdomen.castShadow = true;
        beeGroup.add(abdomen);
        
        // 2. Thorax (denser, slightly fuzzy look via rough texture)
        const thoraxGeo = new THREE.SphereGeometry(0.58, 48, 48);
        const thoraxMat = new THREE.MeshStandardMaterial({ color: 0x5a4a2a, roughness: 0.45, metalness: 0.08 });
        const thorax = new THREE.Mesh(thoraxGeo, thoraxMat);
        thorax.scale.set(0.95, 0.9, 0.85);
        thorax.position.z = 0.35;
        thorax.castShadow = true;
        beeGroup.add(thorax);
        
        // 3. Head (rounded but distinct)
        const headGeo = new THREE.SphereGeometry(0.48, 48, 48);
        const headMat = new THREE.MeshStandardMaterial({ color: 0x3a2e1e, roughness: 0.3 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.scale.set(0.92, 0.88, 0.78);
        head.position.z = 1.05;
        head.castShadow = true;
        beeGroup.add(head);
        
        // 4. Stripes on abdomen (dark bands, realistic dark brown/black)
        const stripeMat = new THREE.MeshStandardMaterial({ color: 0x1e170f, roughness: 0.6, metalness: 0.02 });
        const stripe1 = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.065, 36, 64), stripeMat);
        stripe1.rotation.x = Math.PI / 2;
        stripe1.position.z = -1.0;
        stripe1.scale.set(0.98, 1.0, 0.35);
        beeGroup.add(stripe1);
        
        const stripe2 = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.065, 36, 64), stripeMat);
        stripe2.rotation.x = Math.PI / 2;
        stripe2.position.z = -0.65;
        stripe2.scale.set(1.02, 1.0, 0.4);
        beeGroup.add(stripe2);
        
        const stripe3 = new THREE.Mesh(new THREE.TorusGeometry(0.61, 0.07, 36, 64), stripeMat);
        stripe3.rotation.x = Math.PI / 2;
        stripe3.position.z = -0.28;
        stripe3.scale.set(1.03, 1.0, 0.42);
        beeGroup.add(stripe3);
        
        // 5. Eyes (compound eye style: dark with subtle reflection)
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.85, emissive: 0x111111 });
        const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.18, 48, 48), eyeMat);
        leftEye.position.set(-0.38, 0.28, 1.32);
        beeGroup.add(leftEye);
        
        const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.18, 48, 48), eyeMat);
        rightEye.position.set(0.38, 0.28, 1.32);
        beeGroup.add(rightEye);
        
        // Eye highlights (tiny specular)
        const highlightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x88aaff });
        const leftHL = new THREE.Mesh(new THREE.SphereGeometry(0.045, 24, 24), highlightMat);
        leftHL.position.set(-0.44, 0.34, 1.48);
        beeGroup.add(leftHL);
        const rightHL = new THREE.Mesh(new THREE.SphereGeometry(0.045, 24, 24), highlightMat);
        rightHL.position.set(0.44, 0.34, 1.48);
        beeGroup.add(rightHL);
        
        // 6. Antennae (thin, segmented)
        const antennaMat = new THREE.MeshStandardMaterial({ color: 0x332211 });
        const antennaGeo = new THREE.CylinderGeometry(0.045, 0.035, 0.55, 6);
        const antennaL = new THREE.Mesh(antennaGeo, antennaMat);
        antennaL.position.set(-0.26, 0.48, 1.45);
        antennaL.rotation.z = -0.45;
        antennaL.rotation.x = 0.25;
        beeGroup.add(antennaL);
        
        const antennaR = new THREE.Mesh(antennaGeo, antennaMat);
        antennaR.position.set(0.26, 0.48, 1.45);
        antennaR.rotation.z = 0.45;
        antennaR.rotation.x = 0.25;
        beeGroup.add(antennaR);
        
        // Antenna tips
        const tipMat = new THREE.MeshStandardMaterial({ color: 0x664422 });
        const tipL = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), tipMat);
        tipL.position.set(-0.48, 0.72, 1.6);
        beeGroup.add(tipL);
        const tipR = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), tipMat);
        tipR.position.set(0.48, 0.72, 1.6);
        beeGroup.add(tipR);
        
        // 7. Wings (translucent, veined look, slightly iridescent)
        const wingMatReal = new THREE.MeshStandardMaterial({ color: 0xcceeff, emissive: 0x88aacc, transparent: true, opacity: 0.55, side: THREE.DoubleSide, roughness: 0.3, metalness: 0.25 });
        
        // Left forewing
        const leftWing = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.04, 0.62), wingMatReal);
        leftWing.position.set(-0.85, 0.22, 0.15);
        leftWing.rotation.z = -0.48;
        leftWing.rotation.x = 0.18;
        leftWing.castShadow = true;
        beeGroup.add(leftWing);
        
        // Right forewing
        const rightWing = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.04, 0.62), wingMatReal);
        rightWing.position.set(0.85, 0.22, 0.15);
        rightWing.rotation.z = 0.48;
        rightWing.rotation.x = 0.18;
        rightWing.castShadow = true;
        beeGroup.add(rightWing);
        
        // Hindwings (slightly smaller)
        const hindWingMat = new THREE.MeshStandardMaterial({ color: 0xbbddff, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
        const leftHind = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.04, 0.5), hindWingMat);
        leftHind.position.set(-0.72, 0.12, -0.15);
        leftHind.rotation.z = -0.35;
        leftHind.rotation.x = 0.1;
        beeGroup.add(leftHind);
        
        const rightHind = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.04, 0.5), hindWingMat);
        rightHind.position.set(0.72, 0.12, -0.15);
        rightHind.rotation.z = 0.35;
        rightHind.rotation.x = 0.1;
        beeGroup.add(rightHind);
        
        // 8. Legs (6 legs, articulated realistic)
        const legMatReal = new THREE.MeshStandardMaterial({ color: 0x3a2a18, roughness: 0.7 });
        const legGeo = new THREE.CylinderGeometry(0.055, 0.045, 0.62, 6);
        // leg pairs: front, mid, back
        const legPositions = [
            { pos: [-0.52, -0.28, 0.95], rotZ: 0.3, rotX: 0.4 },  // front left
            { pos: [0.52, -0.28, 0.95], rotZ: -0.3, rotX: 0.4 },   // front right
            { pos: [-0.58, -0.32, 0.42], rotZ: 0.25, rotX: 0.35 },  // mid left
            { pos: [0.58, -0.32, 0.42], rotZ: -0.25, rotX: 0.35 },   // mid right
            { pos: [-0.54, -0.34, -0.25], rotZ: 0.2, rotX: 0.3 },     // back left
            { pos: [0.54, -0.34, -0.25], rotZ: -0.2, rotX: 0.3 }       // back right
        ];
        legPositions.forEach(lp => {
            const leg = new THREE.Mesh(legGeo, legMatReal);
            leg.position.set(lp.pos[0], lp.pos[1], lp.pos[2]);
            leg.rotation.z = lp.rotZ;
            leg.rotation.x = lp.rotX;
            beeGroup.add(leg);
            // add tiny tarsi
            const tarsus = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.28, 4), legMatReal);
            tarsus.position.set(lp.pos[0] + (lp.rotZ > 0 ? 0.22 : -0.22), lp.pos[1] - 0.32, lp.pos[2] + 0.1);
            tarsus.rotation.z = lp.rotZ * 1.2;
            beeGroup.add(tarsus);
        });
        
        // 9. Stinger (tiny, realistic)
        const stingerMat = new THREE.MeshStandardMaterial({ color: 0x221100 });
        const stinger = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.45, 8), stingerMat);
        stinger.position.set(0, -0.18, -1.18);
        stinger.rotation.x = 0.15;
        beeGroup.add(stinger);
        
        // 10. Fine hair effect using tiny particles on thorax (optional but adds realism)
        const furCount = 180;
        const furGeo = new THREE.BufferGeometry();
        const furPositions = [];
        for (let i = 0; i < furCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 0.62;
            const x = Math.sin(phi) * Math.cos(theta) * r;
            const y = Math.sin(phi) * Math.sin(theta) * r * 0.8;
            const z = Math.cos(phi) * r + 0.35;
            furPositions.push(x, y, z);
        }
        furGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(furPositions), 3));
        const furMat = new THREE.PointsMaterial({ color: 0x8a7a4a, size: 0.018 });
        const furPoints = new THREE.Points(furGeo, furMat);
        beeGroup.add(furPoints);
        
        scene.add(beeGroup);
        
        // Initial bee position: far right of screen, slightly offset in Z (distant right)
        // Path: start from right side (x = 6.2, z = -2.5, y=1.2) -> fly towards center (0, 1.3, -0.2) 
        // Then hover briefly, then slowly zoom towards camera (0, 1.2, 3.8) creating 'coming up to user'
        const startPoint = new THREE.Vector3(6.8, 1.35, -2.2);
        const midPoint = new THREE.Vector3(0, 1.45, -0.3);
        const endPoint = new THREE.Vector3(0, 1.25, 4.2);
        
        let animProgress = 0; // 0 to 1 overall
        let phase = 0; // 0: fly to center, 1: hover/natural look-around, 2: slow zoom towards user
        let phaseStartTime = performance.now();
        const phase0Duration = 1900; // flying from right to center
        const phase1Duration = 1500; // hover & look around at center
        const phase2Duration = 2000; // slow zoom forward (coming to user)
        
        // For hover animation: gentle drifting and head rotation
        let hoverCycle = 0;
        let lastTimestamp = 0;
        
        // Wing flap speed factor
        let wingAngle = 0;
        
        // Overlay fade management
        const overlayDiv = document.getElementById('loading-overlay');
        
        // Add a subtle point light attached to bee for realism
        const beeLight = new THREE.PointLight(0xffaa66, 0.5, 5);
        beeLight.position.set(0, 0.2, 0.3);
        beeGroup.add(beeLight);
        
        // Natural bobbing / drifting helper
        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }
        
        function animateFlight() {
            const now = performance.now();
            const elapsedPhase = now - phaseStartTime;
            
            if (phase === 0) {
                let t = Math.min(1, elapsedPhase / phase0Duration);
                const easeT = easeInOutCubic(t);
                // interpolate position from start to mid
                const currentX = startPoint.x * (1 - easeT) + midPoint.x * easeT;
                const currentY = startPoint.y * (1 - easeT) + midPoint.y * easeT + Math.sin(t * Math.PI) * 0.08; // subtle arc
                const currentZ = startPoint.z * (1 - easeT) + midPoint.z * easeT;
                beeGroup.position.set(currentX, currentY, currentZ);
                
                // Natural banking: roll slightly towards direction of motion
                beeGroup.rotation.z = (1 - easeT) * 0.45;
                beeGroup.rotation.x = -0.05 + easeT * 0.1;
                beeGroup.rotation.y = (1 - easeT) * 0.6;
                
                if (t >= 1.0) {
                    phase = 1;
                    phaseStartTime = now;
                    beeGroup.position.copy(midPoint);
                }
            } 
            else if (phase === 1) {
                const tHover = Math.min(1, elapsedPhase / phase1Duration);
                // Hover behavior: natural bobbing, slight yaw and pitch as if looking around
                hoverCycle += 0.018;
                const bobY = Math.sin(hoverCycle * 1.4) * 0.032;
                const bobX = Math.sin(hoverCycle * 1.1) * 0.022;
                beeGroup.position.y = midPoint.y + bobY;
                beeGroup.position.x = midPoint.x + Math.sin(hoverCycle * 0.9) * 0.025;
                // Gentle head/body rotation (looking side to side)
                const lookYaw = Math.sin(hoverCycle * 0.8) * 0.28;
                const lookPitch = Math.sin(hoverCycle * 1.2) * 0.08;
                beeGroup.rotation.y = lookYaw;
                beeGroup.rotation.x = lookPitch;
                beeGroup.rotation.z = Math.sin(hoverCycle * 1.5) * 0.05;
                
                if (tHover >= 1.0) {
                    phase = 2;
                    phaseStartTime = now;
                    // reset rotation for final approach
                    beeGroup.rotation.set(0, 0, 0);
                }
            }
            else if (phase === 2) {
                let tZoom = Math.min(1, elapsedPhase / phase2Duration);
                const easeZoom = 1 - Math.pow(1 - tZoom, 1.5); // ease out, natural slowdown
                // Interpolate from midPoint to endPoint (coming closer to camera)
                const currX = midPoint.x * (1 - easeZoom) + endPoint.x * easeZoom;
                const currY = midPoint.y * (1 - easeZoom) + endPoint.y * easeZoom + Math.sin(tZoom * Math.PI) * 0.045;
                const currZ = midPoint.z * (1 - easeZoom) + endPoint.z * easeZoom;
                beeGroup.position.set(currX, currY, currZ);
                
                // As bee comes closer, slight forward tilt and slight wing adjustment
                beeGroup.rotation.x = -0.08 * easeZoom;
                beeGroup.rotation.y = Math.sin(tZoom * Math.PI * 1.2) * 0.12;
                beeGroup.rotation.z = 0;
                
                // Fade overlay gradually: starts fading around 30% zoom and complete by 95%
                if (overlayDiv) {
                    let fadeAlpha = Math.min(1, Math.max(0, (easeZoom - 0.2) / 0.75));
                    overlayDiv.style.opacity = 1 - fadeAlpha;
                    if (easeZoom >= 0.98) {
                        overlayDiv.classList.add('hidden-overlay');
                        // optional: stop updating phase, but we keep idle
                        if (!window._animationComplete) {
                            window._animationComplete = true;
                            console.log("Loading complete — app ready, bee arrived.");
                        }
                    }
                }
                
                // slight scale factor for extra 'coming up' feel
                const scaleFactor = 1 + easeZoom * 0.08;
                beeGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);
            }
            
            // Wing flapping: faster during flight, realistic frequency
            let flapSpeed = 14;
            if (phase === 1) flapSpeed = 10;
            if (phase === 2) flapSpeed = 16;
            wingAngle += 0.022 * flapSpeed;
            const flapAngle = Math.sin(wingAngle) * 0.82;
            if (leftWing && rightWing) {
                leftWing.rotation.z = -0.48 + flapAngle * 0.65;
                rightWing.rotation.z = 0.48 - flapAngle * 0.65;
                leftHind.rotation.z = -0.35 + flapAngle * 0.5;
                rightHind.rotation.z = 0.35 - flapAngle * 0.5;
            }
            
            // Pulsing bee light for realism
            beeLight.intensity = 0.45 + Math.sin(Date.now() * 0.012) * 0.12;
        }
        
        // Animate particles and background elements
        function animateEnvironment() {
            particles.rotation.y += 0.0008;
            particles.rotation.x += 0.0004;
            bgOrbs.forEach((orb, idx) => {
                orb.position.x += 0.0005;
                if (orb.position.x > 5) orb.position.x = -6;
            });
            rimLight.intensity = 0.65 + Math.sin(Date.now() * 0.003) * 0.12;
            frontFill.intensity = 0.38 + Math.sin(Date.now() * 0.005) * 0.08;
        }
        
        // Render loop
        function renderLoop() {
            requestAnimationFrame(renderLoop);
            animateFlight();
            animateEnvironment();
            camera.lookAt(0, 1.2, 0);
            renderer.render(scene, camera);
        }
        
        renderLoop();
        
        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Small console info
        console.log('Realistic 3D Bee — Natural flight: right → center hover → slow zoom towards viewer');
    </script>
</body>
</html>
