<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AboutEarth — Solar System</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Top left: identity + search -->
    <header id="hud-top-left">
        <div id="brand">
            <span id="brand-mark"></span>
            <span id="brand-text">Solar System</span>
        </div>
        <div id="search-container">
            <svg id="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>
            <input type="text" id="planet-search" placeholder="Search…" autocomplete="off" spellcheck="false">
            <div id="search-results" role="listbox"></div>
        </div>
    </header>

    <!-- Top right: controls -->
    <div id="hud-top-right">
        <button id="quality-toggle" title="Toggle bloom and render resolution">Quality: High</button>
        <div id="fps-readout"></div>
    </div>

    <!-- Right: planet information -->
    <aside id="info-panel" aria-live="polite">
        <button id="info-close" title="Close (Esc)" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
            </svg>
        </button>

        <div id="info-scroll">
            <p id="info-type"></p>
            <h2 id="info-name"></h2>
            <p id="info-about"></p>
            <dl id="info-stats"></dl>
        </div>
    </aside>

    <!-- Bottom: step between bodies -->
    <nav id="nav-arrows">
        <button id="prev-planet" aria-label="Previous body">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15,5 8,12 15,19"></polyline></svg>
        </button>
        <span id="current-nav-name">Planet</span>
        <button id="next-planet" aria-label="Next body">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9,5 16,12 9,19"></polyline></svg>
        </button>
    </nav>

    <!-- Bottom left: contextual hint -->
    <p id="hint">Click a planet to explore · drag to orbit · scroll to zoom</p>

    <script type="module" src="main.js"></script>
</body>
</html>
