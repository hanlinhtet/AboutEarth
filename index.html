<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AboutEarth - Solar System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Three.js and Post-processing from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div id="search-container">
            <input type="text" id="planet-search" placeholder="Search planet..." autocomplete="off">
            <div id="search-results"></div>
        </div>
        <h1 id="planet-name">Solar System</h1>
        <p id="planet-desc">Click a planet to focus.</p>
        <button id="reset-view">Return to Orbit</button>
    </div>

    <div id="nav-arrows">
        <button id="prev-planet">&lt;&lt;</button>
        <span id="current-nav-name">Planet</span>
        <button id="next-planet">&gt;&gt;</button>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
